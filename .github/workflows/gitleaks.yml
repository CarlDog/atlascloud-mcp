# Canonical secret-scanning workflow — standard UNI-04.
#
# The fleet's universal CI floor: every repo runs it, whatever else it does or
# doesn't run. Standalone rather than a job inside a test workflow, so it
# stays independent of that workflow's trigger/gating changes.
#
# Why this exists when the repo already has a pre-commit hook: a local hook is
# bypassable by design (--no-verify, an unset core.hooksPath, a commit pushed
# from a machine that never ran the installer). CI is the backstop that
# cannot be skipped by the person making the mistake.

name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for secrets
    # Same-repo PRs are already scanned by the push run on their branch; the
    # duplicate pull_request run is redundant AND fails on Dependabot PRs
    # (read-only token -> gitleaks-action's PR API calls 403). Keep the
    # pull_request run only for fork PRs, which have no in-repo push event.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: a secret introduced in an earlier commit and removed
          # in a later one is still in the pack and still needs rotating. A
          # shallow clone would scan only the tip and report clean.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
